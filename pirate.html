<html lang="en">
<head>
<meta charset="UTF-8">

<title>Pirate Text Repriser</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    background: #0a1210;
    color: #1a2a28;
    overflow-x: hidden;
  }

  /* Parchment background layers */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,220,160,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(200,160,100,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(180,140,80,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }

  /* ====== HEADER ====== */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    position: relative;
  }

  .quill {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: quillBob 3s ease-in-out infinite;
  }

  @keyframes quillBob {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-6px) rotate(5deg); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 2.2rem;
    color: #c47a2a;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 30px rgba(212,160,86,0.15);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: #6a8a7a;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* Decorative divider */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 24px 0;
    color: #4a6a5a;
    font-size: 1rem;
    opacity: 0.7;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8b6d4a, transparent);
  }

  /* ====== INPUT CARD ====== */
  .card {
    background: linear-gradient(145deg, #e8f0e6, #d8e8d4, #c8dcc2);
    border: 2px solid #8aaa82;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  .card-label {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #4a6a5a;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label .icon { font-size: 1.1rem; }

  textarea {
    width: 100%;
    height: 150px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.6;
    padding: 14px 16px;
    border: 1.5px solid #8aaa82;
    border-radius: 8px;
    background: rgba(255,252,245,0.7);
    color: #1a2a28;
    resize: vertical;
    overflow-wrap: break-word;
    transition: border-color 0.3s, box-shadow 0.3s;
    outline: none;
  }

  textarea:focus {
    border-color: #c47a2a;
    box-shadow: 0 0 0 3px rgba(212,160,86,0.2), 0 2px 12px rgba(0,0,0,0.08);
  }

  textarea::placeholder {
    color: #6a8a7a;
    font-style: italic;
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: #a08a6a;
    margin-top: 6px;
    font-style: italic;
  }

  /* ====== BUTTON ====== */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    padding: 14px 36px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(145deg, #d4a056, #b8862e);
    color: #1a1209;
    box-shadow: 0 4px 16px rgba(180,120,40,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .btn-primary:hover {
    background: linear-gradient(145deg, #e0b066, #c8963e);
    box-shadow: 0 6px 24px rgba(180,120,40,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(180,120,40,0.3);
  }

  .btn-secondary {
    background: transparent;
    color: #6a8a7a;
    border: 1.5px solid #8b6d4a;
    padding: 14px 24px;
  }

  .btn-secondary:hover {
    background: rgba(184,149,106,0.1);
    border-color: #6a8a7a;
  }

  .btn .quill-icon {
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.3s;
  }

  .btn:hover .quill-icon {
    transform: rotate(-15deg) scale(1.1);
  }

  /* Sparkle effect on button */
  .btn-primary::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: btnSparkle 4s linear infinite;
    pointer-events: none;
  }

  @keyframes btnSparkle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ====== OUTPUT CARD ====== */
  .output-card {
    background: linear-gradient(145deg, #f0f8ee, #e4f0e0, #d8e8d2);
    border: 2px solid #8aaa82;
    border-radius: 12px;
    padding: 24px;
    position: relative;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.03);
    overflow: hidden;
  }

  .output-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  /* Corner decorations */
  .output-card::after {
    content: '';
    position: absolute;
    bottom: 8px; right: 8px;
    width: 60px; height: 60px;
    background: radial-gradient(circle at bottom right, rgba(212,160,86,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  #output {
    min-height: 120px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-style: italic;
    line-height: 1.8;
    font-size: 1.2rem;
    color: #1a2a28;
    position: relative;
    z-index: 1;
  }

  #output:empty::before {
    content: 'Yer pirate words shall appear here, Arrr!';
    color: #6a8a7a;
    font-style: italic;
  }

  .output-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(196,162,101,0.3);
  }

  .btn-copy {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    padding: 10px 18px;
    background: rgba(184,149,106,0.15);
    border: 1px solid rgba(184,149,106,0.4);
    border-radius: 6px;
    color: #4a6a5a;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-copy:hover {
    background: rgba(184,149,106,0.25);
    border-color: #6a8a7a;
  }

  .btn-copy.copied {
    background: rgba(80,160,80,0.15);
    border-color: rgba(80,160,80,0.4);
    color: #3a7a3a;
  }

  /* ====== FOOTER ====== */
  .footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(139,109,74,0.3);
    color: #4a6a5a;
    font-style: italic;
    font-size: 0.95rem;
    opacity: 0.7;
  }

  .footer .quill-small { font-size: 1.2rem; margin: 0 4px; }

  /* ====== FLOATING DECORATIONS ====== */
  .float-quill {
    position: fixed;
    font-size: 2rem;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .float-quill:nth-child(1) { top: 10%; left: 5%; transform: rotate(-30deg); animation: floatA 8s ease-in-out infinite; }
  .float-quill:nth-child(2) { top: 30%; right: 4%; transform: rotate(20deg); animation: floatB 10s ease-in-out infinite; }
  .float-quill:nth-child(3) { bottom: 20%; left: 3%; transform: rotate(45deg); animation: floatA 12s ease-in-out infinite reverse; }
  .float-quill:nth-child(4) { bottom: 10%; right: 6%; transform: rotate(-15deg); animation: floatB 9s ease-in-out infinite reverse; }

  @keyframes floatA {
    0%, 100% { transform: translateY(0) rotate(-30deg); }
    50% { transform: translateY(-20px) rotate(-25deg); }
  }
  @keyframes floatB {
    0%, 100% { transform: translateY(0) rotate(20deg); }
    50% { transform: translateY(15px) rotate(25deg); }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 600px) {
    .container { padding: 12px 14px 30px; }
    h1 { font-size: 1.5rem; }
    .subtitle { font-size: 1rem; }
    .card, .output-card { padding: 16px; }
    textarea { height: 120px; font-size: 1.05rem; }
    #output { font-size: 1.05rem; }
    .btn { padding: 12px 24px; font-size: 0.95rem; }
    .btn-row { flex-direction: column; align-items: stretch; }
  }

  /* ====== ANIMATIONS ====== */
  .card, .output-card {
    animation: cardIn 0.6s ease-out both;
  }
  .output-card { animation-delay: 0.15s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #output {
    animation: none;
  }

  #output.active {
    animation: outputGlow 0.5s ease-out;
  }

  @keyframes outputGlow {
    0% { box-shadow: 0 0 0 0 rgba(212,160,86,0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(212,160,86,0.2); }
    100% { box-shadow: none; }
  }

  /* Ink drip decoration on output card */
  .ink-drip {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 12px;
    background: radial-gradient(ellipse at top, rgba(212,160,86,0.3), transparent);
    border-radius: 0 0 50% 50%;
  }

  /* Style Switcher */
  .style-switcher {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .style-switcher a {
    padding: 6px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 2px solid rgba(212,160,86,0.3);
    background: rgba(255,248,230,0.5);
    color: #5a3e1b;
    transition: all 0.3s ease;
  }
  .style-switcher a:hover {
    background: rgba(212,160,86,0.2);
    border-color: rgba(212,160,86,0.6);
    transform: translateY(-1px);
  }
  .style-switcher a.active {
    background: rgba(212,160,86,0.3);
    border-color: rgba(212,160,86,0.8);
    color: #3a2510;
    box-shadow: 0 0 8px rgba(212,160,86,0.3);
  }
</style>

<script>
// Character counter
const inputEl = document.getElementById('input');
const outputEl = document.getElementById('output');
const charCountEl = document.getElementById('charCount');
inputEl.addEventListener('input', () => {
  charCountEl.textContent = inputEl.value.length;
});

// Ctrl+Enter hotkey
inputEl.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    pirateify();
  }
});


// Clear function
function clearAll() {
  inputEl.value = '';
  charCountEl.textContent = '0';
  outputEl.textContent = '';
  outputEl.classList.remove('active');
}

// Copy function
function copyOutput() {
  const text = outputEl.textContent;
  if (!text) return;
  const btn = document.getElementById('copyBtn');
  function showCopied() {
    btn.classList.add('copied');
    btn.innerHTML = '<span>&#10003;</span> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>&#128203;</span> Copy to Clipboard';
    }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showCopied();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showCopied();
  }
}

// ============================================================
// HELPER: pick a random number of words from text and apply alliteration
// ============================================================
function maybeAddAlliteration(text) {
  if (!chance(0.08)) return text;
  let words = text.split(/\s+/);
  if (words.length < 4) return text;
  let idx = Math.floor(Math.random() * (words.length - 2));
  let phrase = pick(alliterations);
  words.splice(idx + 1, 0, "," + phrase + ",");
  return words.join(" ");
}

// ============================================================
// HELPER: insert a metaphor after a comma
// ============================================================
function maybeAddMetaphor(text) {
  if (!chance(0.06)) return text;
  let commaIdx = text.indexOf(',');
  if (commaIdx < 0 || commaIdx > text.length - 10) return text;
  let metaphor = "like " + pick(metaphors);
  return text.substring(0, commaIdx + 1) + " " + metaphor + "," + text.substring(commaIdx + 1);
}

// ============================================================
// HELPER: insert a random pirate saying
// ============================================================
function maybeInsertQuote(text) {
  if (!chance(0.04)) return text;
  var q = ['Arrr!', 'Ahoy!', 'Yo ho ho!', 'Avast ye!', "By Davy Jones' locker!"];
  return text + " " + q[Math.floor(Math.random() * q.length)];
}

// ============================================================
// HELPER: insert a pirate insult
// ============================================================
function maybeInsertInsult(text) {
  if (!chance(0.05)) return text;
  var insult = pick(insults);
  return text + ", " + insult + "!";
}

// ============================================================
// HELPER: maybe add a dramatic aside
// ============================================================
function maybeAddAside(text) {
  if (!chance(0.04)) return text;
  return text + pick(asides);
}

// ============================================================
// HELPER: maybe add a stage direction
// ============================================================
function maybeAddStageDirection(text) {
  if (!chance(0.03)) return text;
  return text + pick(stageDirections);
}

// ============================================================
// HELPER: invert a sentence for emphasis
// ============================================================
function maybeInvert(text) {
  if (!chance(0.12)) return text;
  for (const [pat, fn] of inversions) {
    let newText = text.replace(pat, fn);
    if (newText !== text) {
      text = newText;
      break;
    }
  }
  return text;
}

// ============================================================
// HELPER: add pirate flavor to some sentences
// ============================================================
function maybeAddFiller(text) {
  if (!chance(0.15)) return text;
  var fillers = ['arr', 'by the powers', 'avast', 'yo ho', 'scurvy'];
  var words = text.split(/\s+/);
  if (words.length < 3) return text;
  var idx = Math.floor(Math.random() * Math.min(3, words.length));
  words.splice(idx + 1, 0, fillers[Math.floor(Math.random() * fillers.length)]);
  return words.join(" ");
}

// ============================================================
// HELPER: wrap a clause in parentheses for dramatic effect
// ============================================================
function maybeAddParenthetical(text) {
  if (!chance(0.06)) return text;
  var parentheticals = ["(by Davy Jones' locker)", '(shiver me timbers)', '(as the tide turns)'];
  var words = text.split(/\s+/);
  if (words.length < 5) return text;
  var idx = Math.floor(Math.random() * (words.length - 2)) + 1;
  words.splice(idx, 0, parentheticals[Math.floor(Math.random() * parentheticals.length)]);
  return words.join(" ");
}

// ============================================================
// MAIN FUNCTION
// ============================================================
function pirateify() {
  let text = inputEl.value;
  if (!text.trim()) {
    outputEl.textContent = "Arrr! Give me some words, matey!";
    return;
  }

  // Split into sentences
  let sentences = text.match(/[^.!?]*[.!?]+|[^.!?]+/g) || [text];
  let result = [];

  for (let s of sentences) {
    s = s.trim();
    if (!s) continue;

    // Apply sentence-level transforms first (longest matches)
    for (const [pat, rep] of sentenceTransforms) s = s.replace(pat, rep);
    for (const [pat, rep] of contractions) s = s.replace(pat, rep);
    for (const [neg, rep] of Object.entries(negatives)) {
      let re = new RegExp("\\b" + neg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "\\b", "gi");
      s = s.replace(re, rep);
    }

    for (const [pat, rep] of pronouns) s = s.replace(pat, rep);
    for (const [pat, rep] of verbForms) s = s.replace(pat, rep);
    for (const [pat, rep] of commonWords) s = s.replace(pat, rep);
    for (const [pat, rep] of verbs) s = s.replace(pat, rep);
    for (const [pat, rep] of adjectives) s = s.replace(pat, rep);
    for (const [pat, rep] of nouns) s = s.replace(pat, rep);

    // Advanced transformations
    s = maybeInvert(s);
    s = maybeAddFiller(s);
    s = maybeAddMetaphor(s);
    s = maybeAddAlliteration(s);
    s = maybeAddParenthetical(s);
    s = maybeInsertInsult(s);

    // Opening exclamation (~35%)
    if (chance(0.35)) s = pick(openings) + " " + s;

    // Mid-sentence insertion (~20%)
    if (chance(0.20)) {
      let cIdx = s.indexOf(',');
      if (cIdx > 0 && cIdx < s.length - 5) {
        s = s.substring(0, cIdx) + pick(midInsertions) + s.substring(cIdx + 1);
      }
    }

    result.push(s);
  }

  text = result.join(" ");

  // Post-processing on full text
  text = maybeInsertQuote(text);
  text = maybeAddAside(text);
  text = maybeAddStageDirection(text);

  // Cleanups
  text = text.replace(/\s+([.,!?;:])/g, "$1");
  text = text.replace(/,\s*,/g, ",");
  text = text.replace(/\.\s*\./g, ".");
  text = text.replace(/!\s*!/g, "!");
  text = text.replace(/\?\s*\?/g, "?");
  
  
  
  
  
  
  text = text.replace(/\bi\b/g, "I");

  // Capitalise first letter of each sentence
  text = text.replace(/(^\s*|[.!?]+\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());

  // Fix double spaces
  text = text.replace(/  +/g, " ");

  outputEl.textContent = text;
  outputEl.classList.remove('active');
  void outputEl.offsetWidth; // trigger reflow
  outputEl.classList.add('active');
}
