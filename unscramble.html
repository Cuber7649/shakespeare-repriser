<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unscramble the Text</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    background: #1a1209;
    color: #3d2b1f;
    overflow-x: hidden;
  }

  /* Parchment background layers */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,220,160,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(200,160,100,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(180,140,80,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }

  /* ====== HEADER ====== */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    position: relative;
  }

  .quill {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: quillBob 3s ease-in-out infinite;
  }

  @keyframes quillBob {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-6px) rotate(5deg); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 2.2rem;
    color: #d4a056;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 30px rgba(212,160,86,0.15);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: #b8956a;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* Decorative divider */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 24px 0;
    color: #8b6d4a;
    font-size: 1rem;
    opacity: 0.7;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8b6d4a, transparent);
  }

  /* ====== INPUT CARD ====== */
  .card {
    background: linear-gradient(145deg, #faf3e6, #f0e4cc, #e8d9b8);
    border: 2px solid #c4a265;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  .card-label {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #8b6d4a;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label .icon { font-size: 1.1rem; }

  textarea {
    width: 100%;
    height: 150px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.6;
    padding: 14px 16px;
    border: 1.5px solid #c4a265;
    border-radius: 8px;
    background: rgba(255,252,245,0.7);
    color: #3d2b1f;
    resize: vertical;
    overflow-wrap: break-word;
    transition: border-color 0.3s, box-shadow 0.3s;
    outline: none;
  }

  textarea:focus {
    border-color: #d4a056;
    box-shadow: 0 0 0 3px rgba(212,160,86,0.2), 0 2px 12px rgba(0,0,0,0.08);
  }

  textarea::placeholder {
    color: #b8956a;
    font-style: italic;
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: #a08a6a;
    margin-top: 6px;
    font-style: italic;
  }

  /* ====== BUTTON ====== */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    padding: 14px 36px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(145deg, #d4a056, #b8862e);
    color: #1a1209;
    box-shadow: 0 4px 16px rgba(180,120,40,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .btn-primary:hover {
    background: linear-gradient(145deg, #e0b066, #c8963e);
    box-shadow: 0 6px 24px rgba(180,120,40,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(180,120,40,0.3);
  }

  .btn-secondary {
    background: transparent;
    color: #b8956a;
    border: 1.5px solid #8b6d4a;
    padding: 14px 24px;
  }

  .btn-secondary:hover {
    background: rgba(184,149,106,0.1);
    border-color: #b8956a;
  }

  .btn .quill-icon {
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.3s;
  }

  .btn:hover .quill-icon {
    transform: rotate(-15deg) scale(1.1);
  }

  /* Sparkle effect on button */
  .btn-primary::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: btnSparkle 4s linear infinite;
    pointer-events: none;
  }

  @keyframes btnSparkle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ====== OUTPUT CARD ====== */
  .output-card {
    background: linear-gradient(145deg, #fffcf5, #f8f0de, #f2e8ce);
    border: 2px solid #c4a265;
    border-radius: 12px;
    padding: 24px;
    position: relative;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.03);
    overflow: hidden;
  }

  .output-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  /* Corner decorations */
  .output-card::after {
    content: '';
    position: absolute;
    bottom: 8px; right: 8px;
    width: 60px; height: 60px;
    background: radial-gradient(circle at bottom right, rgba(212,160,86,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  #output {
    min-height: 120px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-style: italic;
    line-height: 1.8;
    font-size: 1.2rem;
    color: #3d2b1f;
    position: relative;
    z-index: 1;
  }

  #output:empty::before {
    content: 'Your words shall appear here, awaiting transformation...';
    color: #b8956a;
    font-style: italic;
  }

  .output-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(196,162,101,0.3);
  }

  .btn-copy {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    padding: 10px 18px;
    background: rgba(184,149,106,0.15);
    border: 1px solid rgba(184,149,106,0.4);
    border-radius: 6px;
    color: #8b6d4a;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-copy:hover {
    background: rgba(184,149,106,0.25);
    border-color: #b8956a;
  }

  .btn-copy.copied {
    background: rgba(80,160,80,0.15);
    border-color: rgba(80,160,80,0.4);
    color: #3a7a3a;
  }

  /* ====== FOOTER ====== */
  .footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(139,109,74,0.3);
    color: #8b6d4a;
    font-style: italic;
    font-size: 0.95rem;
    opacity: 0.7;
  }

  .footer .quill-small { font-size: 1.2rem; margin: 0 4px; }

  /* ====== FLOATING DECORATIONS ====== */
  .float-quill {
    position: fixed;
    font-size: 2rem;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .float-quill:nth-child(1) { top: 10%; left: 5%; transform: rotate(-30deg); animation: floatA 8s ease-in-out infinite; }
  .float-quill:nth-child(2) { top: 30%; right: 4%; transform: rotate(20deg); animation: floatB 10s ease-in-out infinite; }
  .float-quill:nth-child(3) { bottom: 20%; left: 3%; transform: rotate(45deg); animation: floatA 12s ease-in-out infinite reverse; }
  .float-quill:nth-child(4) { bottom: 10%; right: 6%; transform: rotate(-15deg); animation: floatB 9s ease-in-out infinite reverse; }

  @keyframes floatA {
    0%, 100% { transform: translateY(0) rotate(-30deg); }
    50% { transform: translateY(-20px) rotate(-25deg); }
  }
  @keyframes floatB {
    0%, 100% { transform: translateY(0) rotate(20deg); }
    50% { transform: translateY(15px) rotate(25deg); }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 600px) {
    .container { padding: 12px 14px 30px; }
    h1 { font-size: 1.5rem; }
    .subtitle { font-size: 1rem; }
    .card, .output-card { padding: 16px; }
    textarea { height: 120px; font-size: 1.05rem; }
    #output { font-size: 1.05rem; }
    .btn { padding: 12px 24px; font-size: 0.95rem; }
    .btn-row { flex-direction: column; align-items: stretch; }
  }

  /* ====== ANIMATIONS ====== */
  .card, .output-card {
    animation: cardIn 0.6s ease-out both;
  }
  .output-card { animation-delay: 0.15s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #output {
    animation: none;
  }

  #output.active {
    animation: outputGlow 0.5s ease-out;
  }

  @keyframes outputGlow {
    0% { box-shadow: 0 0 0 0 rgba(212,160,86,0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(212,160,86,0.2); }
    100% { box-shadow: none; }
  }

  /* Ink drip decoration on output card */
  .ink-drip {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 12px;
    background: radial-gradient(ellipse at top, rgba(212,160,86,0.3), transparent);
    border-radius: 0 0 50% 50%;
  }

  /* Style Switcher */
  .style-switcher {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .style-switcher a {
    padding: 6px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 2px solid rgba(212,160,86,0.3);
    background: rgba(255,248,230,0.5);
    color: #5a3e1b;
    transition: all 0.3s ease;
  }
  .style-switcher a:hover {
    background: rgba(212,160,86,0.2);
    border-color: rgba(212,160,86,0.6);
    transform: translateY(-1px);
  }
  .style-switcher a.active {
    background: rgba(212,160,86,0.3);
    border-color: rgba(212,160,86,0.8);
    color: #3a2510;
    box-shadow: 0 0 8px rgba(212,160,86,0.3);
  }

</style>

  <div class="output-card">

  <div class="footer">

  </div>
</div>

        if(D[stripped]){result.push(D[stripped]+(pm2?pm2[1]:''));}
        else{result.push(w);}
      }
      i++;
    }
  }
  r=result.join('');

  r=r.replace(/\s+/g,' ');
  r=r.replace(/^\s+/,'');
  r=r.replace(/\s+$/,'');

  outputEl.textContent=r;
  outputEl.classList.add('active');
  outputEl.style.whiteSpace='pre-wrap';
  copyBtn.classList.add('active');
}
