<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random &middot; Text Repriser Collection</title>
<meta name="description" content="Draw a roast, a compliment or a quote in any of six historical and literary voices.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2b2d42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repriser">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    background: #1a1209;
    color: #3d2b1f;
    overflow-x: hidden;
  }

  /* Parchment background layers */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,220,160,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(200,160,100,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(180,140,80,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }

  /* ====== HEADER ====== */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    position: relative;
  }

  .quill {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: quillBob 3s ease-in-out infinite;
  }

  @keyframes quillBob {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-6px) rotate(5deg); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 2.2rem;
    color: #d4a056;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 30px rgba(212,160,86,0.15);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: #b8956a;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* Decorative divider */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 24px 0;
    color: #8b6d4a;
    font-size: 1rem;
    opacity: 0.7;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8b6d4a, transparent);
  }

  /* ====== INPUT CARD ====== */
  .card {
    background: linear-gradient(145deg, #faf3e6, #f0e4cc, #e8d9b8);
    border: 2px solid #c4a265;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  .card-label {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #8b6d4a;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label .icon { font-size: 1.1rem; }

  textarea {
    width: 100%;
    height: 150px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.6;
    padding: 14px 16px;
    border: 1.5px solid #c4a265;
    border-radius: 8px;
    background: rgba(255,252,245,0.7);
    color: #3d2b1f;
    resize: vertical;
    overflow-wrap: break-word;
    transition: border-color 0.3s, box-shadow 0.3s;
    outline: none;
  }

  textarea:focus {
    border-color: #d4a056;
    box-shadow: 0 0 0 3px rgba(212,160,86,0.2), 0 2px 12px rgba(0,0,0,0.08);
  }

  textarea::placeholder {
    color: #b8956a;
    font-style: italic;
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: #a08a6a;
    margin-top: 6px;
    font-style: italic;
  }

  /* ====== BUTTON ====== */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    padding: 14px 36px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(145deg, #d4a056, #b8862e);
    color: #1a1209;
    box-shadow: 0 4px 16px rgba(180,120,40,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .btn-primary:hover {
    background: linear-gradient(145deg, #e0b066, #c8963e);
    box-shadow: 0 6px 24px rgba(180,120,40,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(180,120,40,0.3);
  }

  .btn-secondary {
    background: transparent;
    color: #b8956a;
    border: 1.5px solid #8b6d4a;
    padding: 14px 24px;
  }

  .btn-secondary:hover {
    background: rgba(184,149,106,0.1);
    border-color: #b8956a;
  }

  .btn .quill-icon {
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.3s;
  }

  .btn:hover .quill-icon {
    transform: rotate(-15deg) scale(1.1);
  }

  /* Sparkle effect on button */
  .btn-primary::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: btnSparkle 4s linear infinite;
    pointer-events: none;
  }

  @keyframes btnSparkle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ====== OUTPUT CARD ====== */
  .output-card {
    background: linear-gradient(145deg, #fffcf5, #f8f0de, #f2e8ce);
    border: 2px solid #c4a265;
    border-radius: 12px;
    padding: 24px;
    position: relative;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.03);
    overflow: hidden;
  }

  .output-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b6d4a, #d4a056, #8b6d4a);
  }

  /* Corner decorations */
  .output-card::after {
    content: '';
    position: absolute;
    bottom: 8px; right: 8px;
    width: 60px; height: 60px;
    background: radial-gradient(circle at bottom right, rgba(212,160,86,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  #output {
    min-height: 120px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-style: italic;
    line-height: 1.8;
    font-size: 1.2rem;
    color: #3d2b1f;
    position: relative;
    z-index: 1;
  }

  #output:empty::before {
    content: 'Thy words shall appear here, awaiting transformation...';
    color: #b8956a;
    font-style: italic;
  }

  .output-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(196,162,101,0.3);
  }

  /* Available to assistive tech, not shown on screen. */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  .btn-copy {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    padding: 10px 18px;
    background: rgba(184,149,106,0.15);
    border: 1px solid rgba(184,149,106,0.4);
    border-radius: 6px;
    color: #8b6d4a;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-copy:hover {
    background: rgba(184,149,106,0.25);
    border-color: #b8956a;
  }

  .btn-copy.copied {
    background: rgba(80,160,80,0.15);
    border-color: rgba(80,160,80,0.4);
    color: #3a7a3a;
  }

  /* ====== FOOTER ====== */
  .footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(139,109,74,0.3);
    color: #8b6d4a;
    font-style: italic;
    font-size: 0.95rem;
    opacity: 0.7;
  }

  .footer .quill-small { font-size: 1.2rem; margin: 0 4px; }

  /* ====== FLOATING DECORATIONS ====== */
  .float-quill {
    position: fixed;
    font-size: 2rem;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .float-quill:nth-child(1) { top: 10%; left: 5%; transform: rotate(-30deg); animation: floatA 8s ease-in-out infinite; }
  .float-quill:nth-child(2) { top: 30%; right: 4%; transform: rotate(20deg); animation: floatB 10s ease-in-out infinite; }
  .float-quill:nth-child(3) { bottom: 20%; left: 3%; transform: rotate(45deg); animation: floatA 12s ease-in-out infinite reverse; }
  .float-quill:nth-child(4) { bottom: 10%; right: 6%; transform: rotate(-15deg); animation: floatB 9s ease-in-out infinite reverse; }

  @keyframes floatA {
    0%, 100% { transform: translateY(0) rotate(-30deg); }
    50% { transform: translateY(-20px) rotate(-25deg); }
  }
  @keyframes floatB {
    0%, 100% { transform: translateY(0) rotate(20deg); }
    50% { transform: translateY(15px) rotate(25deg); }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 600px) {
    .container { padding: 12px 14px 30px; }
    h1 { font-size: 1.5rem; }
    .subtitle { font-size: 1rem; }
    .card, .output-card { padding: 16px; }
    textarea { height: 120px; font-size: 1.05rem; }
    #output { font-size: 1.05rem; }
    .btn { padding: 12px 24px; font-size: 0.95rem; }
    .btn-row { flex-direction: column; align-items: stretch; }
  }

  /* ====== ANIMATIONS ====== */
  .card, .output-card {
    animation: cardIn 0.6s ease-out both;
  }
  .output-card { animation-delay: 0.15s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #output {
    animation: none;
  }

  #output.active {
    animation: outputGlow 0.5s ease-out;
  }

  @keyframes outputGlow {
    0% { box-shadow: 0 0 0 0 rgba(212,160,86,0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(212,160,86,0.2); }
    100% { box-shadow: none; }
  }

  /* ====== REDUCED MOTION ====== */
  /* `animation: none` rather than a 0.01ms duration: cardIn uses fill-mode
     `both`, so a short duration would still hold opacity 0 during its delay. */
  

  /* Ink drip decoration on output card */
  .ink-drip {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 12px;
    background: radial-gradient(ellipse at top, rgba(212,160,86,0.3), transparent);
    border-radius: 0 0 50% 50%;
  }

  /* Style Switcher */
  .style-switcher {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .style-switcher a {
    padding: 6px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 2px solid rgba(212,160,86,0.3);
    background: rgba(255,248,230,0.5);
    color: #5a3e1b;
    transition: all 0.3s ease;
  }
  .style-switcher a:hover {
    background: rgba(212,160,86,0.2);
    border-color: rgba(212,160,86,0.6);
    transform: translateY(-1px);
  }
  .style-switcher a.active {
    background: rgba(212,160,86,0.3);
    border-color: rgba(212,160,86,0.8);
    color: #3a2510;
    box-shadow: 0 0 8px rgba(212,160,86,0.3);
  }

  /* ====== PICKER ====== */
  .picks {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .pick {
    flex: 1 1 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pick select {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.05rem;
    color: #3d2b1f;
    background: #fffdf6;
    border: 1px solid rgba(196,162,101,0.6);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 44px;
  }
  .pick select:focus-visible {
    outline: 2px solid #8a6a3a;
    outline-offset: 2px;
  }
  .drawer {
    margin: 20px 0;
    padding: 26px 24px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(180deg, #fdf6e3 0%, #f4e8cd 100%);
    border: 1px solid rgba(196,162,101,0.55);
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(61,43,31,0.12);
  }
  .draw-text {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.6rem;
    line-height: 1.5;
    color: #3d2b1f;
    overflow-wrap: break-word;
  }
  .draw-text::before { content: '\201C'; }
  .draw-text::after { content: '\201D'; }
  .attrib {
    margin: 12px 0 0;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a6a3a;
  }
  .attrib:empty { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .btn-primary::after { animation: none !important; }
  }
  /* ====== QUOTE CARD MODAL ====== */
  #cardModal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 14, 8, 0.82);
  }
  #cardModal[hidden] { display: none; }
  .modal-box {
    background: linear-gradient(145deg, #fdf6e3 0%, #f4e8cd 100%);
    border: 2px solid rgba(196,162,101,0.7);
    border-radius: 12px;
    padding: 20px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    animation: cardIn 0.24s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  .modal-box h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    color: #3a2510;
    margin: 0 0 4px;
  }
  .modal-note {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #8a6a3a;
    font-size: 0.9rem;
    margin: 0 0 14px;
  }
  #cardPreview {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid rgba(196,162,101,0.5);
    border-radius: 6px;
    background: #f4e8cd;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .modal-actions .btn { padding: 10px 20px; font-size: 0.95rem; }
  .modal-warn {
    font-family: 'Cormorant Garamond', serif;
    color: #a04a2a;
    font-size: 0.9rem;
    margin: 10px 0 0;
  }
  .modal-warn[hidden] { display: none; }</style>
</head>
<body>

<div class="float-quill">&#128396;</div>
<div class="float-quill">&#128396;</div>
<div class="float-quill">&#128396;</div>
<div class="float-quill">&#128396;</div>

  <div class="style-switcher">
    <a href="./index.html">All Styles</a>
    <a href="./random.html" class="active">Random</a>
  <a href="./shakespeare.html">Shakespeare</a>
  <a href="./pirate.html">Pirate</a>
  <a href="./victorian.html">Victorian</a>
  <a href="./chaucer.html">Chaucer</a>
  <a href="./yoda.html">Yoda</a>
  <a href="./norse.html">Norse</a>
  <a href="./unscramble.html">Unscramble</a>
  </div>

<div class="container">
  <header class="header">
    <span class="quill">&#128396;</span>
    <h1>Random</h1>
    <p class="subtitle">A roast, a compliment or a quote, in any voice</p>
  </header>

  <div class="divider">&#10045; Anno Domini MDLXIV &#10045;</div>

  <div class="card">
    <div class="picks">
      <div class="pick">
        <label class="card-label" for="category"><span class="icon">&#9733;</span> Kind</label>
        <select id="category">
      <option value="roast">Roast</option>
      <option value="compliment">Compliment</option>
      <option value="quote">Quote</option>
      <option value="any">Any</option>
        </select>
      </div>
      <div class="pick">
        <label class="card-label" for="style"><span class="icon">&#128396;</span> Voice</label>
        <select id="style">
      <option value="shakespeare">Shakespeare</option>
      <option value="pirate">Pirate</option>
      <option value="victorian">Victorian</option>
      <option value="chaucer">Chaucer</option>
      <option value="yoda">Yoda</option>
      <option value="norse">Norse</option>
      <option value="any">Any</option>
        </select>
      </div>
    </div>
  </div>

  <div class="drawer">
    <p class="draw-text" id="drawText"></p>
    <p class="attrib" id="attrib"></p>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="draw">
      <span class="quill-icon">&#127922;</span> <span id="drawLabel">Draw</span>
    </button>
    <button class="btn btn-secondary" id="makeCard" disabled>
      <span>&#9786;</span> Make Card
    </button>
  </div>

  <span class="visually-hidden" id="drawStatus" role="status"></span>

  <div class="footer">
    <span class="quill-small">&#128396;</span>
    Crafted with ink &amp; devotion
    <span class="quill-small">&#128396;</span>
  </div>
</div>

<div id="cardModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
    <h2 id="cardModalTitle">Quote card</h2>
    <p class="modal-note" id="cardModalNote">Preparing&hellip;</p>
    <canvas id="cardPreview" width="1080" height="1350" role="img" aria-label="Preview of the generated quote card"></canvas>
    <p class="modal-warn" id="cardModalWarn" hidden>Text was too long to fit, so it has been cut short.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cardClose">Close</button>
      <button class="btn btn-primary" id="cardDownload">Download PNG</button>
    </div>
  </div>
</div>

<span class="visually-hidden" id="cardStatus" role="status"></span>

<script>
/* GENERATED by tools/build-random.mjs - do not edit by hand.
   Roasts and quotes are lifted verbatim from the six style pages, so this file
   cannot drift from them. Compliments come from compliments.js at the repo root.
   Run: node tools/build-random.mjs */
const RANDOM_DATA = {};
const STYLE_IDS = ["shakespeare","pirate","victorian","chaucer","yoda","norse"];
const CATEGORY_IDS = ["roast","compliment","quote"];
const CATEGORY_LABELS = [["roast","Roast"],["compliment","Compliment"],["quote","Quote"]];

const COMPLIMENTS = {
  shakespeare: [
    "God keep thee, goodly sir",
    "Heaven shine upon thy countenance",
    "Thou art a soul of gentle worth",
    "Thy tongue is honest, thy heart is true",
    "Thou dost adorn the company thou keepest",
    "Grace and good conscience attend thee",
    "Thou art as welcome as the month of May",
    "Thy virtues are a crown that cannot tarnish",
    "Let heaven's favour rest upon thee",
    "Thou hast a faithful heart and a willing hand",
    "Thou art the honour of thine own house",
    "Blessings on thee, thou worthy soul",
  ],
  pirate: [
    "God bless thee, stout-hearted matey",
    "May God keep thee safe at sea",
    "Ye be a fair hand and an honest one",
    "Heaven grant ye a favourable wind",
    "Ye be a credit to every ship ye sail",
    "God speed thee well, good mate",
    "Saint Christopher watch o'er ye at sea",
    "Ye carry honour in the salt and sun",
    "The Lord grant ye a peaceful harbour",
    "Ye be the best mate a captain ever had",

  const maxHeight = o.maxHeight != null ? o.maxHeight
    : CARD_TEXT_BOTTOM - CARD_TEXT_TOP;
  const minFont = o.minFont != null ? o.minFont : CARD_FONT_MIN;
  const maxFont = o.maxFont != null ? o.maxFont : CARD_FONT_MAX;

  // Display type needs proportionally tighter leading than body copy.
  const ratioFor = (font) => (font >= 100 ? 1.14 : font >= 72 ? 1.2 : font >= 48 ? 1.3 : 1.42);

  const body = stripStageBusiness(text);
  if (!body) {
    return { lines: [], font: maxFont, lineHeight: maxFont * ratioFor(maxFont), truncated: false };
  }

  const budgetFor = (font) => Math.max(1, Math.floor(maxHeight / (font * ratioFor(font))));

  // Largest size that fits, stepping down. Short quotes therefore render large
  // and fill the card instead of stranding a couple of small lines.
  let font = maxFont;
  let lines = wrapParagraph(body, measure, maxWidth, font);
  let truncated = false;

  while (font > minFont && lines.length > budgetFor(font)) {
    font -= 1;
    lines = wrapParagraph(body, measure, maxWidth, font);
  }

  // Still too tall at the minimum size: drop the overflow and mark the cut.
  const ratio = ratioFor(font);
  const budget = budgetFor(font);
  if (lines.length > budget) {
    lines = lines.slice(0, budget);
    let last = lines[budget - 1] || '';
    while (last.length > 1 && measure(last + '…', font) > maxWidth) {
      last = last.slice(0, -1);
    }
    lines[budget - 1] = last.replace(/\s+$/, '') + '…';
    truncated = true;
  }

  return { lines, font, lineHeight: font * ratio, truncated };
}

// Canvas primitives only, so nothing external is loaded and the canvas is never
// tainted (text, fills and strokes), which keeps toBlob/export working.
function drawCard(ctx, layout, theme, opts) {
  const o = opts || {};
  const W = o.width || CARD_W;
  const H = o.height || CARD_H;
  const L = W - CARD_PAD;
  const cy = H / 2;

  // Parchment, lit from the upper left.
  const bg = ctx.createLinearGradient(0, 0, W * 0.55, H);
  bg.addColorStop(0, theme.from);
  bg.addColorStop(0.55, theme.mid);
  bg.addColorStop(1, theme.to);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Very light vignette: enough to warm the corners, not so much that it reads
  // as a spotlight behind the text.
  const vig = ctx.createRadialGradient(cy, cy * 0.9, W * 0.42, cy, cy, H * 0.72);
  vig.addColorStop(0, 'rgba(255,255,255,0.05)');
  vig.addColorStop(0.7, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(74,52,28,0.10)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Gold frame plus a hairline inner rule.
  ctx.strokeStyle = CARD_ACCENT;
  ctx.lineWidth = 5;
  ctx.strokeRect(26, 26, W - 52, H - 52);
  ctx.lineWidth = 1.25;
  ctx.strokeRect(44, 44, W - 88, H - 88);

  // Top ornament: a rule broken by a small diamond.
  const oy = 150;
  ctx.strokeStyle = CARD_ACCENT_SOFT;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(CARD_PAD + 40, oy);
  ctx.lineTo(cy - 24, oy);
  ctx.moveTo(cy + 24, oy);
  ctx.lineTo(L - 40, oy);
  ctx.stroke();
  ctx.fillStyle = CARD_ACCENT;
  ctx.beginPath();
  ctx.moveTo(cy, oy - 11);
  ctx.lineTo(cy + 11, oy);
  ctx.lineTo(cy, oy + 11);
  ctx.lineTo(cy - 11, oy);
  ctx.closePath();
  ctx.fill();

  // Quote group: an oversized opening quote, the text, then a matching closing
  // quote. Both are part of the measured group, so the composition balances as
  // one unit rather than leaving a dead band above or below the text.
  const zoneH = CARD_TEXT_BOTTOM - CARD_TEXT_TOP;
  const blockH = layout.lines.length * layout.lineHeight;
  const markSize = Math.round(layout.font * 1.5);
  const markH = layout.font * 0.46;
  const markGap = layout.font * 0.26;
  const closeGap = layout.font * 0.08;
  const closeH = layout.font * 0.4;
  const groupH = markH + markGap + blockH + closeGap + closeH;
  const top = CARD_TEXT_TOP + (zoneH - groupH) / 2 - groupH * 0.03;
  const textTop = top + markH + markGap;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  // U+201C / U+201D already carry the correct opening and closing shapes, so
  // no rotation is needed.
  ctx.fillStyle = 'rgba(196,140,52,0.62)';
  ctx.font = '400 ' + markSize + 'px ' + CARD_QUOTE_FONT;
  ctx.fillText('“', CARD_PAD - 6, top);

  ctx.fillStyle = CARD_INK;
  ctx.font = 'italic 400 ' + layout.font + 'px ' + CARD_QUOTE_FONT;
  for (let i = 0; i < layout.lines.length; i++) {
    ctx.fillText(layout.lines[i], CARD_PAD, textTop + i * layout.lineHeight);
  }

  ctx.fillStyle = 'rgba(196,140,52,0.62)';
  ctx.font = '400 ' + markSize + 'px ' + CARD_QUOTE_FONT;
  ctx.textAlign = 'right';
  ctx.fillText('”', L, textTop + blockH + closeGap);

  // Footer: a hairline above a letterspaced style name.
  ctx.strokeStyle = CARD_ACCENT_SOFT;
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  ctx.moveTo(CARD_PAD, CARD_LABEL_RULE_Y);
  ctx.lineTo(L, CARD_LABEL_RULE_Y);
  ctx.stroke();

  ctx.fillStyle = CARD_LABEL_INK;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = '700 26px ' + CARD_LABEL_FONT;
  // Canvas has no letter-spacing in older engines, so track the caps by hand.
  drawTracked(ctx, theme.label.toUpperCase(), CARD_PAD, CARD_LABEL_RULE_Y + 48, 9);

  return { font: layout.font, lineHeight: layout.lineHeight, truncated: layout.truncated };
}

// Manual letter spacing, so the label reads as a considered small-caps line
// rather than a bare word in the corner.
function drawTracked(ctx, text, x, y, track) {
  let cx = x;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + track;
  }
  return cx - track - x;
}

// Fonts must be resolved before drawing or canvas silently substitutes a
// fallback serif. Resolves to null rather than rejecting when offline.
function ensureCardFonts() {
  if (typeof document === 'undefined' || !document.fonts) return Promise.resolve(null);
  const wanted = [
    'italic 400 48px "Cormorant Garamond"',
    '700 26px Cinzel',
  ];
  return Promise.all(
    wanted.map(function (spec) {
      try { return document.fonts.load(spec); } catch (e) { return Promise.resolve([]); }
    })
  )
    .then(function () { return document.fonts.ready; })
    .then(function () { return true; })
    .catch(function () { return null; });
}

const CARD_DPR_CAP = 2;

function makeCardCanvas() {
  const canvas = document.createElement('canvas');
  // Capped at 2: the card is nominally 1080x1350, so a 2x buffer is already
  // double that and stays sharp, while a 3x buffer is 13.1M pixels (~50MB) for
  // detail that every viewer and social platform discards anyway. The cap keeps
  // the export viable on high-density phones.
  const dpr = Math.min(CARD_DPR_CAP, Math.max(1, window.devicePixelRatio || 1));
  canvas.width = CARD_W * dpr;
  canvas.height = CARD_H * dpr;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { canvas: canvas, ctx: ctx, dpr: dpr };
}

function renderCard(text, styleId) {
  const theme = CARD_THEMES[styleId] || CARD_THEMES.shakespeare;
  return ensureCardFonts().then(function () {
    const made = makeCardCanvas();
    // measureText reflects whatever ctx.font is currently set to, and the canvas
    // default is "10px sans-serif". Setting the font here rather than relying on
    // drawCard means every measurement is taken at the size it will be drawn at;
    // otherwise nothing wraps and every line silently overflows the card.
    const measure = function (s, f) {
      made.ctx.font = 'italic 400 ' + f + 'px ' + CARD_QUOTE_FONT;
      return made.ctx.measureText(s).width;
    };
    const layout = layoutCard(text, measure, {});
    const meta = drawCard(made.ctx, layout, theme, {});
    return { canvas: made.canvas, layout: layout, theme: theme, meta: meta };
  });
}

// The anchor must be in the document before click() and the object URL must
// outlive the call, or Firefox and Safari cancel the download.
function downloadCard(canvas, filename) {
  return new Promise(function (resolve, reject) {
    canvas.toBlob(function (blob) {
      if (!blob) { reject(new Error('canvas produced no blob')); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      resolve(blob.size);
    }, 'image/png');
  });
}

// Shared quote-card preview modal wiring.
//
// Why this is a module rather than copy-pasted into each generated page: the
// dashboard and the random picker both offer "Make Card", and the two had
// already started to drift when the dashboard version was inlined. One source,
// inlined by both builders, keeps them identical.
//
// Markup is tools/card-modal.html and styles are tools/card-modal.css, both read
// and inlined by the builders. Ids, class names and behaviour are unchanged from
// the version that shipped, so tools/smoke-dashboard.mjs needed no edits.
//
// `themes`/`render`/`download` are injected so this also runs under
// tools/smoke-dashboard.mjs and tools/smoke-random.mjs with fakes.

function initCardUI(opts) {
  opts = opts || {};
  var themes = opts.themes || (typeof CARD_THEMES !== 'undefined' ? CARD_THEMES : null);
  var render = opts.render || renderCard;
  var download = opts.download || downloadCard;
  var filenameFor = opts.filenameFor ||
    function (styleId) { return 'repriser-' + (styleId || 'card') + '-card.png'; };
  var emptyMessage = opts.emptyMessage || 'Transform some text first';

  var modal = document.getElementById('cardModal');
  var preview = document.getElementById('cardPreview');
  var noteEl = document.getElementById('cardModalNote');
  var warnEl = document.getElementById('cardModalWarn');
  var cardStatusEl = document.getElementById('cardStatus');
  var closeBtn = document.getElementById('cardClose');
  var downloadBtn = document.getElementById('cardDownload');

  var lastFocus = null;
  var lastCard = null;
  var lastStyleId = null;

  function focusables() {
    return Array.prototype.slice.call(
      modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    ).filter(function (el) { return !el.disabled && el.offsetParent !== null; });
  }

  function open(styleId, text, fromEl) {
    if (!text || !text.trim()) {
      cardStatusEl.textContent = emptyMessage;
      return;
    }
    lastFocus = fromEl || null;
    lastStyleId = styleId;
    var theme = (themes && themes[styleId]) || (themes && themes.shakespeare) ||
      { label: 'Quote' };
    noteEl.textContent = 'Drawing a ' + theme.label.toLowerCase() + ' card';
    warnEl.hidden = true;
    modal.hidden = false;
    closeBtn.focus();

    render(text, styleId).then(function (r) {
      var ctx = preview.getContext('2d');
      ctx.clearRect(0, 0, preview.width, preview.height);
      ctx.drawImage(r.canvas, 0, 0, preview.width, preview.height);
      warnEl.hidden = !r.meta.truncated;
      noteEl.textContent = r.meta.truncated
        ? 'Cut short to fit ' + r.meta.font + 'px text'
        : r.meta.font + 'px text';
      lastCard = r;
      cardStatusEl.textContent = theme.label + ' quote card ready';
    }).catch(function () {
      noteEl.textContent = 'Could not draw the card';
      cardStatusEl.textContent = 'Could not draw the card';
    });
  }

  function close() {
    if (modal.hidden) return;
    modal.hidden = true;
    lastCard = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function isOpen() { return !modal.hidden; }

  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });

  document.addEventListener('keydown', function (e) {
    if (modal.hidden) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    var items = focusables();
    if (!items.length) return;
    var first = items[0];
    var last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  });

  downloadBtn.addEventListener('click', function () {
    if (!lastCard) return;
    download(lastCard.canvas, filenameFor(lastStyleId))
      .then(function (size) {
        cardStatusEl.textContent = 'Card downloaded, ' + Math.round(size / 1024) + ' kilobytes';
      }).catch(function () {
        cardStatusEl.textContent = 'The card could not be saved';
      });
  });

  return { open: open, close: close, isOpen: isOpen };
}


(function () {
  const categoryEl = document.getElementById('category');
  const styleEl = document.getElementById('style');
  const textEl = document.getElementById('drawText');
  const attribEl = document.getElementById('attrib');
  const statusEl = document.getElementById('drawStatus');
  const drawBtn = document.getElementById('draw');
  const drawLabel = document.getElementById('drawLabel');
  const cardBtn = document.getElementById('makeCard');

  const cardUI = initCardUI({ emptyMessage: 'Draw something first' });

  let lastPick = null;

  function draw() {
    const wantCategory = categoryEl.value;
    const wantStyle = styleEl.value;
    let picked = null;

    // Never show the same line twice running, unless the chosen pool is a single
    // entry. A dozen attempts is ample: every list here holds 18+ entries.
    for (let attempt = 0; attempt < 12 && !picked; attempt++) {
      const styleId = wantStyle === 'any' ? pick(STYLE_IDS) : wantStyle;
      const category = wantCategory === 'any' ? pick(CATEGORY_IDS) : wantCategory;
      const text = pick(RANDOM_DATA[styleId][category]);
      if (!lastPick
        || lastPick.styleId !== styleId
        || lastPick.category !== category
        || lastPick.text !== text) {
        picked = { styleId: styleId, category: category, text: text };
      }
    }
    if (!picked) picked = lastPick;
    if (!picked) return;
    lastPick = picked;

    textEl.textContent = picked.text;
    attribEl.textContent = RANDOM_DATA[picked.styleId].label
      + ' \u00B7 ' + labelFor(picked.category);
    drawLabel.textContent = 'Draw again';
    cardBtn.disabled = false;
    statusEl.textContent = labelFor(picked.category) + ' in the '
      + RANDOM_DATA[picked.styleId].label + ' voice: ' + picked.text;
  }

  function labelFor(category) {
    const hit = CATEGORY_LABELS.filter(function (c) { return c[0] === category; });
    return hit.length ? hit[0][1] : category;
  }

  drawBtn.addEventListener('click', draw);
  categoryEl.addEventListener('change', draw);
  styleEl.addEventListener('change', draw);

  cardBtn.addEventListener('click', function () {
    if (!lastPick) return;
    cardUI.open(lastPick.styleId, lastPick.text, cardBtn);
  });

  draw();
})();
</script>
</body>
</html>
