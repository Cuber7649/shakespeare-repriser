name: test

on:
  # Same-repo pull requests already run the pull_request job; limiting push to
  # main avoids running the suite twice for every PR commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The CDP harness uses the global WebSocket, stable from Node 22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A CI action is not a project dependency: no package.json entry, no
      # install step. Its chrome-path output is passed to the harness below.
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      # REQUIRE_BROWSER makes the journeys fail loudly instead of skipping, so
      # the browser leg cannot go dark.
      - name: Run the full suite (Chrome is the primary browser)
        run: npm test
        env:
          REQUIRE_BROWSER: '1'
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
