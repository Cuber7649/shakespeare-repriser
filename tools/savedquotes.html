<section class="saved-quotes" id="savedQuotes">
  <div class="card-label"><span class="icon">&#128218;</span> Saved Quotes</div>
  <div class="saved-quotes-toolbar">
    <label class="visually-hidden" for="sqSearch">Search saved quotes</label>
    <input type="search" class="saved-quotes-field" id="sqSearch" placeholder="Search&hellip;" autocomplete="off">
    <label class="visually-hidden" for="sqFilter">Filter by style</label>
    <select class="saved-quotes-field" id="sqFilter">
      <option value="">All styles</option>
    </select>
  </div>
  <div class="saved-quotes-toolbar">
    <label class="visually-hidden" for="sqTitle">Optional title for the next save</label>
    <input type="text" class="saved-quotes-field saved-quotes-title-field" id="sqTitle" placeholder="Optional title&hellip;" maxlength="60" autocomplete="off">
    <button type="button" class="saved-quotes-action" id="sqExport">Export</button>
    <button type="button" class="saved-quotes-action" id="sqImportBtn">Import</button>
    <input type="file" id="sqImport" accept="application/json,.json" class="visually-hidden">
    <button type="button" class="saved-quotes-action saved-quotes-action-danger" id="sqClear">Clear all</button>
  </div>
  <p class="saved-quotes-empty" id="savedQuotesEmpty">Nothing saved yet.</p>
  <ul class="saved-quotes-list" id="savedQuotesList"></ul>
  <span class="visually-hidden" id="savedQuotesStatus" role="status"></span>
</section>
